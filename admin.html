<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>荼荼 · 上传后台</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="wrap">

  <!-- 简单密码门：只是防止链接被随手打开误传，不是真正的安全措施，重要数据仍靠R2/Worker权限保护 -->
  <div class="gate" id="gate">
    <h1>荼荼 · 上传后台</h1>
    <input type="password" id="pwInput" placeholder="输入访问密码">
    <button class="primary" id="pwBtn">进入</button>
    <div id="pwErr" style="color:var(--accent); font-size:13px;"></div>
  </div>

  <div id="app" style="display:none;">
    <h1 id="pageTitle">荼荼 · 上传后台</h1>
    <div class="sub" id="pageSub">选分类、填编号、传图，几秒后主站就会更新</div>

    <div class="tabs">
      <button class="tabBtn active" id="tabUpload">新增模板</button>
      <button class="tabBtn" id="tabDelete">删除模板</button>
      <button class="tabBtn" id="tabCatManage">分类管理</button>
    </div>

    <div id="uploadPanel">
      <fieldset>
        <legend>分类</legend>
        <select id="catSelect"></select>
        <button class="link" id="newCatToggle" style="margin-top:10px;">+ 新建分类</button>
        <div id="newCatBox">
          <label>分类名称（中文，比如 歌单模板）</label>
          <input type="text" id="newCatName" placeholder="歌单模板">
          <div style="font-size:12px; color:var(--ink-soft); margin-top:6px;">
            已有分类：<span id="existingCatNames"></span> —— 新建前请确认不是其中之一打错字了
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>模板信息</legend>
        <label>编号前缀（比如"冠名卡"，图片文件名必须是纯数字，如 1.jpg 或 2.1.jpg）</label>
        <input type="text" id="prefixInput" placeholder="例如 冠名卡">

        <div class="row">
          <div>
            <label>比例</label>
            <select id="ratioSelect">
              <option value="3/4">3 : 4（默认）</option>
              <option value="1/1">1 : 1</option>
              <option value="9/16">9 : 16</option>
              <option value="16/9">16 : 9</option>
            </select>
          </div>
          <div>
            <label>兜底色块（图片加载前显示）</label>
            <input type="color" id="colorInput" value="#C8472B">
            <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
              <input type="range" id="colorAlphaInput" min="0" max="100" value="100" style="flex:1;">
              <span id="colorAlphaLabel" style="font-size:12px; color:var(--ink-soft); width:36px;">100%</span>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>图片（可多选，每张图各自变成一个新模板，编号从文件名里的数字自动提取）</legend>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div id="filePreview" style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;"></div>
      </fieldset>

      <button class="primary" id="submitBtn">上传</button>
      <div class="progressBar" id="progressBar"><div id="progressFill"></div></div>
      <div id="status"></div>
    </div>

    <div id="deletePanel" style="display:none;">
      <fieldset>
        <legend>模板列表</legend>
        <label>选分类查看模板列表</label>
        <select id="deleteCatSelect"></select>
        <input type="text" id="deleteSearchInput" placeholder="按编号搜索…" style="margin-top:10px;">
        <div id="deleteList" style="margin-top:14px; display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto;"></div>
      </fieldset>
    </div>

    <div id="categoryManagePanel" style="display:none;">
      <fieldset>
        <legend>分类顺序与名称</legend>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">用上下箭头调整分类在首页的显示顺序；改名字填好之后点"保存名称"</div>
        <div id="catManageList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </fieldset>
    </div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
